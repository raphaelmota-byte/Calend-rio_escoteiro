<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calendário Escoteiro</title>
        <link rel="stylesheet" href="css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    </head>
    <body>

        <header id="topo">
            <div class="container_header">
                <div class="img_topo">

                    <img src="/frontend/img/barraca_header.svg" alt="barraca">

                </div>
                <h1>111° GEAR Santos Dumont</h1>

                <div class="nav-calendario">
                      <button id="btn-prev" aria-label="Mês anterior">‹</button>
                      <span id="titulo-calendario">agosto de 2026</span>
                      <button id="btn-next" aria-label="Próximo mês">›</button>
                  </div>

                <button id="btn-hoje">Hoje</button>
                <button id="btn-menu" aria-label="Abrir menu de filtros">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

            </div>
        </header>

        <div id="app"> <!-- app é o padrao para representar onde vai entrar a logica da aplicação -->
            <aside id="sidebar">
                <div class="grupo-filtro">

                    <h2>Categorias</h2>
                    <div id="filtro-categorias">

                    </div>

                </div>
                <div class="grupo-filtro">

                    <h2>Seções</h2>
                    <div id="filtro-secoes">
                        
                    </div>

                </div>
            </aside>
            <div id="overlay"></div>

            <!-- main é o principal conteudo da aplicaçõa, só deve existir uma main por código -->
            <main id="conteudo">
                <div id="calendario"></div>
            </main>
        </div>
        
        
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
        <script src="js/main.js"></script>
       
    </body>
</html>
